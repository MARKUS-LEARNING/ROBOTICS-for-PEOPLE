name: Vault lint

# Checks every pull request against tools/schema.yml, tools/tags.yml and tools/subfields.yml.
# Enforcing since the schema v2 migration: any lint error fails the check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  LINT_MODE: "--enforce"   # "" = report only, "--enforce" = fail the check on errors

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.2
      - name: Parser tests
        run: python -m unittest discover -s tools -v
      - name: Vault stats
        run: python tools/vault.py stats
      - name: Lint
        run: python tools/vault.py lint --github $LINT_MODE
      - name: Generated pages are up to date (Subfield Atlas, Frontier, Learning Paths)
        run: python tools/vault.py pages --check

  sources:
    # Every citation in a note's `sources:` must answer, and arXiv titles must match arXiv's record.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.2
      - name: Check citations
        run: python tools/check_sources.py
