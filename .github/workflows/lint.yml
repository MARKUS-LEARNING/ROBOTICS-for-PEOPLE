name: Vault lint

# Checks every pull request against tools/schema.yml, tools/tags.yml and tools/subfields.yml.
# Report-only while the schema v2 migration lands chapter by chapter; switch LINT_MODE to --enforce afterwards.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  LINT_MODE: ""   # "" = report only, "--enforce" = fail the check on errors

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml==6.0.2
      - name: Parser tests
        run: python -m unittest discover -s tools -v
      - name: Vault stats
        run: python tools/vault.py stats
      - name: Lint
        run: python tools/vault.py lint --github $LINT_MODE
