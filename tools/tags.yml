# Controlled tag vocabulary for ROBOTICS-for-PEOPLE. Enforced by `python3 tools/vault.py lint`.
#
# Conventions: lowercase kebab-case; well-known acronyms stay acronyms in lowercase (ros, slam, pid, urdf, imu, mpc).
# Tags are for *topics*. What kind of note it is goes in `type:`, how hard in `level:`, which part of robotics in
# `subfield:` (see tools/schema.yml), so tags never duplicate those fields.
#
# Adding a tag: check `vocabulary` (and the Obsidian Tags pane) for an existing spelling first. If it is really new,
# add it to `vocabulary` in the same pull request as the note that uses it.

# variant (matched case-insensitively) -> canonical tag
