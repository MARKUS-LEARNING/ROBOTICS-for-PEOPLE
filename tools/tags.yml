# Tags that become the note's `type:` (and are removed from tags) when the note has no type yet.
to_type:
  tutorial: tutorial
  tutorials: tutorial
  lab: lab
  labs: lab
  chapter-overview: overview
  guide: guide
  course-notes: reference
  project: tutorial
  projects: tutorial

# Tags that were applied in bulk. Kept only where the note's folder or text supports them (regex, case-insensitive).
conditional:
  mobile-robot: '\bmobile\b|\bwheel(ed|s)?\b|\brover\b|\bAGV\b|\bAMR\b|odometry|navigation|differential.drive|nonholonomic|04_Mobile_Robots'
  manipulator-arm: '\bmanipulator|\brobot(ic)? arm|\barms?\b|end.effector|\bgripper|serial chain|\bjoint space|03_Industrial_Arms|08_Robot_Hands'

