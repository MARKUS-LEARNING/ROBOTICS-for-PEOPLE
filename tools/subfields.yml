    tags: [manipulator-arm, manipulation, grasping, end-effector, gripper, dexterity]
  mobile-robots:
    title: Mobile Robots and Navigation
    group: body
    description: "Wheeled and tracked robots, odometry, navigation stacks and autonomous ground vehicles."
    folders: [08_Robot_Types_and_Applications/01_Robot_Types/04_Mobile_Robots, 08_Robot_Types_and_Applications/01_Robot_Types/14_Autonomous_Robots, 06_Robot_Control/03_Navigation_and_Motion]
    tags: [mobile-robot, wheeled-robot, navigation, nonholonomic, autonomous-driving, rover]
  legged-humanoid:
    title: Legged Locomotion and Humanoids
    group: body
    fast_moving: true
    description: "Walking and running machines, from quadrupeds to full humanoids: gaits, balance, whole-body control."
    folders: [08_Robot_Types_and_Applications/01_Robot_Types/02_Humanoid_Robots, 08_Robot_Types_and_Applications/01_Robot_Types/07_Legged_Robots]
    tags: [legged-robot, humanoid, locomotion, gait, bipedal, quadruped, hexapod]
  aerial-robotics:
    title: Aerial Robotics
    group: body
    description: "Drones, multirotors and fixed-wing UAVs, aerial manipulation."
    folders: [08_Robot_Types_and_Applications/01_Robot_Types/20_Drones]
    tags: [aerial-robotics]
  soft-robotics:
    title: Soft and Continuum Robotics
    group: body
    description: "Robots made of compliant materials, continuum and cable-driven bodies."
    folders: [08_Robot_Types_and_Applications/01_Robot_Types/10_Soft_Robotics, 08_Robot_Types_and_Applications/01_Robot_Types/12_Cable-Driven_Robots]
    tags: [soft-robotics, compliance]
  bio-inspired:
    title: Bio-inspired Robotics
    group: body
    description: "Borrowing from animals and plants: biomimetic design, morphology and locomotion."
    folders: [08_Robot_Types_and_Applications/01_Robot_Types/11_Bio-inspired_Robotics, 09_Advanced_Topics/08_Bio_Inspired_and_Biomimetic_Robotics]
    tags: [bio-inspired-robotics, biomechanics]
  modular-reconfigurable:
    title: Modular, Reconfigurable and Parallel Robots
    group: body
    description: "Robots that change shape or are built from repeated modules, and parallel mechanisms."
    folders: [08_Robot_Types_and_Applications/01_Robot_Types/13_Reconfigurable_Robots, 08_Robot_Types_and_Applications/01_Robot_Types/16_Modular_Robots, 08_Robot_Types_and_Applications/01_Robot_Types/17_Parallel_Robots, 09_Advanced_Topics/07_Specialized_Robot_Morphologies]
    tags: [modularity, reconfigurability, parallel-robot]
  micro-nano:
    title: Micro- and Nanorobotics
    group: body
    description: "Robots too small to see: magnetic microswimmers, nanomanipulation, robots inside the body."
    folders: []
    tags: [nanotechnology]

