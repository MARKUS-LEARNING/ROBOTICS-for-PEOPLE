# The Subfield Atlas: robotics as a field without edges.
#
# Every note names 1-3 of these keys in its `subfield:` frontmatter. The Atlas page, the site navigation, the
# learning paths and graph.json are all built from this list. A subfield with no notes yet is kept on purpose: it is
# an open invitation and shows up on the Frontier page.
#
# Adding a subfield: add an entry here (key in kebab-case), then tag notes with it. `folders` and `tags` are only
# hints used by `vault.py migrate` to propose values; authors have the final say in each note's frontmatter.
# `fast_moving: true` marks subfields where notes need an `as_of` date and are listed on the Frontier when they fall
# more than 12 months behind the most recently updated note.
#
# group: core      = the stack every robot is built on
#        body      = how robots are shaped and move
#        domain    = where robots work
#        society   = robots among people
#        frontier  = directions still being invented

subfields:
  # ------------------------------------------------------------------------------------------------ core
  foundations:
    title: Foundations of Robotics
    group: core
    description: "What robots are and how the field fits together: definitions, robot anatomy, and the big picture that connects every other subfield."
    folders: [01_Fundamentals_of_Robotics/01_Introduction_to_Robotics, 01_Fundamentals_of_Robotics/03_Basic_Concepts_and_Terminology/02_Robot_Anatomy_Terms]
    tags: [robot-design, mechatronics, robot-types]
  mathematics:
    title: Mathematics for Robotics
    group: core
    description: "Linear algebra, calculus, probability, spatial math (SO(3)/SE(3), Lie groups) and optimization."
    folders: [02_Mathematics_for_Robotics]
    tags: [mathematics, linear-algebra, calculus, probability, statistics, optimization, lie-groups, spatial-math, so3, se3, quaternions, manifolds, numerical-methods]
  kinematics-dynamics:
    title: Kinematics and Dynamics
    group: core
    description: "How bodies and chains move and why: forward/inverse/differential kinematics, Jacobians, Newton-Euler and Lagrangian dynamics."
    folders: [03_Kinematics_and_Dynamics/00_Introduction, 03_Kinematics_and_Dynamics/01_Forward_and_Inverse_Kinematics, 03_Kinematics_and_Dynamics/02_Dynamics_of_Robot_Manipulators]
    tags: [kinematics, forward-kinematics, inverse-kinematics, differential-kinematics, jacobian, dynamics, lagrangian-dynamics, newton-euler, degrees-of-freedom, singularities, workspace, configuration-space]
  mechanisms-actuation:
    title: Mechanisms, Actuation and Materials
    group: core
    description: "Joints, linkages, gears and transmissions, motors, hydraulics and pneumatics, and the materials robots are made of."
    folders: [03_Kinematics_and_Dynamics/04_Mechanisms_and_Actuation, 09_Advanced_Topics/09_Advanced_Materials]
    tags: [mechanism, mechanism-design, actuators, transmission, gears, hydraulics, pneumatics, materials, smart-materials, mechanical-design, joints]
  perception:
    title: Sensing and Perception
    group: core
    description: "Sensors and turning their signals into understanding: cameras, LIDAR, IMUs, computer vision, calibration."
    folders: [04_Sensors_and_Perception/00_Introduction_to_Sensors_and_Perception, 04_Sensors_and_Perception/01_Types_of_Sensors, 04_Sensors_and_Perception/03_Computer_Vision_in_Robotics, 04_Sensors_and_Perception/04_Sensor_Calibration]
    tags: [sensors, perception, computer-vision, camera, lidar, imu, rgb-d, calibration, point-cloud, image-processing]
  estimation-mapping:
    title: State Estimation, Localization and Mapping
    group: core
    description: "Knowing where the robot is and what is around it: filters, sensor fusion, localization, mapping and SLAM."
    folders: [04_Sensors_and_Perception/02_Sensor_Fusion, 04_Sensors_and_Perception/05_Mapping, 09_Advanced_Topics/02_Advanced_Perception_and_Estimation]
    tags: [state-estimation, sensor-fusion, kalman-filter, localization, mapping, slam, occupancy-grid, probabilistic-robotics]
  planning:
    title: Motion Planning and Decision Making
    group: core
    description: "Deciding where to go and how: path and trajectory planning, sampling-based planners, task planning and behaviour trees."
    folders: [03_Kinematics_and_Dynamics/03_Trajectory_Planning, 09_Advanced_Topics/04_Advanced_Planning_and_Reasoning]
    tags: [path-planning, motion-planning, trajectory-optimization, obstacle-avoidance, decision-making, behavior-tree, graph-traversal]
  control:
    title: Control
    group: core
    description: "Making the body do what the plan says: feedback, PID, state-space, optimal, adaptive, robust and interaction control."
    folders: [06_Robot_Control/00_Introduction_to_Robot_Control, 06_Robot_Control/01_Core_Theory, 06_Robot_Control/02_Control_Strategies, 09_Advanced_Topics/01_Advanced_Control_and_Dynamical_Systems]
    tags: [control, control-theory, feedback-control, pid, state-space, optimal-control, mpc, lqr, adaptive-control, robust-control, stability]
  robot-learning:
    title: AI and Robot Learning
    group: core
    fast_moving: true
    description: "Machine learning, deep learning, reinforcement and imitation learning, foundation and vision-language-action models."
    folders: [05_AI_and_Machine_Learning, 09_Advanced_Topics/03_Advanced_AI_Learning_for_Robotics]
    tags: [artificial-intelligence, machine-learning, deep-learning, reinforcement-learning, neural-networks, robot-learning, embodied-ai]
  software:
    title: Robot Software and Middleware
    group: core
    fast_moving: true
    description: "ROS 2 and its ecosystem, simulation, build tools, and the engineering practice of shipping robot code."
    folders: [07_Robot_Operating_System_(ROS), 11_Practical_Implementation, 12_Labs_and_Tutorials]
    tags: [ros, ros2, robotics-software, middleware, simulation, gazebo, software-engineering, programming]
  electronics-embedded:
    title: Electronics, Power and Embedded Systems
    group: core
    description: "Power systems, batteries, motor drivers, buses (CAN, EtherCAT), microcontrollers and real-time computing."
    folders: []
    tags: [electronics, electrical, embedded-systems, power-systems, communication-protocols, real-time, hardware-interface]
  systems-engineering:
    title: Systems Engineering, Safety and Testing
    group: core
    description: "Integrating everything into a robot that works, is safe, and can be tested, verified and maintained."
    folders: []
    tags: [systems-engineering, safety, testing, verification, integration, system-design]

  # ------------------------------------------------------------------------------------------------ body
  manipulation:
