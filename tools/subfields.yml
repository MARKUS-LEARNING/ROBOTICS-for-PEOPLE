# Folders whose notes span many subfields (overviews and glossary-style fundamentals): migrate proposes from tags only.
general_folders: [00_Introduction, 01_Fundamentals_of_Robotics, 08_Robot_Types_and_Applications/01_Robot_Types, 13_Tools_References_and_Links]
